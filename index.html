<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Yönlendirme</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000; /* Siyah arka plan */
        }

        .container {
            text-align: center;
            color: white;
        }

        .button {
            padding: 20px 40px;
            background-color: #800080; /* Mor arka plan */
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
        }

        .button:hover {
            background-color: #4b0082; /* Hover için daha koyu mor */
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://t.me/m3rtw2" class="button">TÜM REKLAMLAR GEÇİLİR</a>
    </div>
</body>
</html>
